[package]
name = "paladinscat-mods"
version = "0.1.3"
edition = "2024"
publish = false
license = "MIT"
description = "PaladinsCat mod releases"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
strip = true
lto = "thin"

[[bin]]
name = "paladinscat-mods"
path = "src/main.rs"

[[bin]]
name = "package-release"
path = "src/bin/package-release.rs"
